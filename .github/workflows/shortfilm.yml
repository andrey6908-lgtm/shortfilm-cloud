# Облачный рендер анимационной короткометражки.
#
# Нагрузка чисто счётная: ни стока, ни поиска, ни ключей — numpy+PIL рисуют
# каждый кадр с нуля. Поэтому дробится по кадрам идеально: каждая машина
# берёт свой отрезок, кодирует свой кусок mp4, в конце один раннер склеивает
# куски без перекодирования и кладёт немой мастер релизом.
#
# Звук НЕ едет сюда: музыку и эффекты подмешивает машина пользователя из
# своей библиотеки на D: — так в облако не уезжает ни одного чужого файла.
#
# Шрифты (Calibri/Bahnschrift/Segoe Script) лежат в ПРИВАТНОМ shortfilm-assets
# и забираются read-only deploy-ключом из секрета ASSETS_KEY. В публичный
# репозиторий их класть нельзя — это была бы их публичная раздача.

name: shortfilm

on:
  push:
    paths: ["job/**"]
  workflow_dispatch:

# Группа по коммиту: шесть языковых версий идут параллельно и не отменяют
# одна другую. При ОБЩЕЙ группе GitHub держит в ожидании ровно один прогон, а
# каждый следующий push отменяет предыдущий ожидающий (гоча лаборатории 05.11).
concurrency:
  group: shortfilm-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- подготовка
  setup:
    runs-on: ubuntu-latest
    outputs:
      name:   ${{ steps.job.outputs.name }}
      mode:   ${{ steps.job.outputs.mode }}
      frames_list: ${{ steps.job.outputs.frames_list }}
      frames: ${{ steps.job.outputs.frames }}
      fps:    ${{ steps.job.outputs.fps }}
      shards: ${{ steps.job.outputs.shards }}
      lang:   ${{ steps.job.outputs.lang }}
      tone:   ${{ steps.job.outputs.tone }}
      mirror: ${{ steps.job.outputs.mirror }}
      speed:  ${{ steps.job.outputs.speed }}
      cam:    ${{ steps.job.outputs.cam }}
      film:   ${{ steps.job.outputs.film }}
      list:   ${{ steps.job.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: job
        name: Прочитать задание
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          j = json.load(open("job/job.json", encoding="utf-8"))
          frames = int(round(j["dur"]*j["fps"]))
          n = int(j.get("shards", 10))
          print(f"mode={j.get('mode','full')}")
          print("frames_list=" + ",".join(str(x) for x in j.get("frames", [])))
          print(f"name={j['name']}")
          print(f"frames={frames}")
          print(f"fps={j['fps']}")
          print(f"shards={n}")
          print("lang=" + j.get("lang", "ru"))
          print("tone=" + j.get("tone", j.get("lang", "ru")))
          print("mirror=" + str(j.get("mirror", "0")))
          print("speed=" + str(j.get("speed", "1")))
          print("cam=" + j.get("cam", "none"))
          print("film=" + j.get("film", "render3"))
          print("list=" + json.dumps(list(range(n))))
          PY
      - run: |
          echo "ролик: ${{ steps.job.outputs.name }}"
          echo "кадров: ${{ steps.job.outputs.frames }}, машин: ${{ steps.job.outputs.shards }}"

  # ------------------------------------------------------------------- рендер
  render:
    needs: setup
    if: needs.setup.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.setup.outputs.list) }}
    steps:
      - uses: actions/checkout@v4

      - name: Забрать шрифты из приватного репозитория
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ASSETS_KEY }}
      - run: |
          git clone --depth 1 git@github.com:${{ github.repository_owner }}/shortfilm-assets.git /tmp/assets
          ls -la /tmp/assets/fonts

      # ffmpeg берём из PyPI (imageio-ffmpeg), а НЕ из apt: замер 22.10 показал
      # разброс apt-get от 24 с до 10 минут на разных раннерах — отстающая
      # машина держала всю матрицу. Через pip это стабильные секунды.
      - name: Поставить numpy, pillow и ffmpeg
        run: |
          # arabic-reshaper и python-bidi нужны арабской версии: PIL сам не
          # соединяет вязь и не разворачивает строку справа налево.
          pip install --quiet --upgrade numpy pillow imageio-ffmpeg arabic-reshaper python-bidi
          echo "FF=$(python3 -c 'import imageio_ffmpeg as f; print(f.get_ffmpeg_exe())')" >> "$GITHUB_ENV"
          "$(python3 -c 'import imageio_ffmpeg as f; print(f.get_ffmpeg_exe())')" -version | head -1

      - name: Нарисовать свой отрезок
        env:
          SHORTFILM_FONTS: /tmp/assets/fonts
          SHORTFILM_LANG: ${{ needs.setup.outputs.lang }}
          SHORTFILM_TONE: ${{ needs.setup.outputs.tone }}
          SHORTFILM_MIRROR: ${{ needs.setup.outputs.mirror }}
          SHORTFILM_SPEED: ${{ needs.setup.outputs.speed }}
          SHORTFILM_CAM: ${{ needs.setup.outputs.cam }}
          SHORTFILM_FILM: ${{ needs.setup.outputs.film }}
        run: |
          total=${{ needs.setup.outputs.frames }}
          n=${{ needs.setup.outputs.shards }}
          k=${{ matrix.shard }}
          a=$(( total*k/n )); b=$(( total*(k+1)/n ))
          echo "шард $k: кадры $a..$((b-1))"
          cd engine
          WORKERS=$(nproc) python3 cloud_render.py "$a" "$b" "$PWD/frames3"
          echo "$a" > /tmp/first

      - name: Склеить отрезок в кусок mp4
        run: |
          mkdir -p out
          "$FF" -nostdin -hide_banner -loglevel error \
            -framerate ${{ needs.setup.outputs.fps }} \
            -start_number "$(cat /tmp/first)" \
            -i engine/frames3/f%05d.jpg \
            -c:v libx264 -preset slow -crf 17 -pix_fmt yuv420p \
            -x264-params keyint=60:min-keyint=60:scenecut=0 \
            "out/part$(printf '%03d' ${{ matrix.shard }}).mp4"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.shard }}
          path: out/*.mp4
          retention-days: 1

  # ------------------------------------------------------------------ склейка
  concat:
    needs: [setup, render]
    if: needs.setup.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          merge-multiple: true
          path: parts

      - name: Поставить ffmpeg
        run: |
          pip install --quiet --upgrade imageio-ffmpeg
          echo "FF=$(python3 -c 'import imageio_ffmpeg as f; print(f.get_ffmpeg_exe())')" >> "$GITHUB_ENV"

      - name: Склеить куски без перекодирования
        run: |
          ls -la parts
          for f in $(ls parts/part*.mp4 | sort); do echo "file '$PWD/$f'"; done > list.txt
          cat list.txt
          "$FF" -nostdin -hide_banner -loglevel error -f concat -safe 0 -i list.txt \
                 -c copy "mute.mp4"
          ls -la *.mp4

      # ЗВУК ПЕРЕЕХАЛ В ОБЛАКО 24.10 (прямое слово пользователя 23.10: на его
      # машине не считается ничего). Музыка и эффекты лежат в приватном
      # shortfilm-assets/audio рядом со шрифтами и забираются тем же ключом.
      # Рецепт — прежний, из cloud/sound.sh, отметки для ролика 186 с.
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ASSETS_KEY }}
      - run: |
          git clone --depth 1 git@github.com:${{ github.repository_owner }}/shortfilm-assets.git /tmp/assets
          ls -la /tmp/assets/audio

      - name: Подмешать музыку и звуки
        run: |
          IN=mute.mp4
          OUT="${{ needs.setup.outputs.name }}.mp4"
          A=/tmp/assets/audio
          DUR=$(python3 -c "print(${{ needs.setup.outputs.frames }}/${{ needs.setup.outputs.fps }})")
          SP=${{ needs.setup.outputs.speed }}
          FILM=${{ needs.setup.outputs.film }}
          FADE=4.5
          FST=$(python3 -c "print(max(0.0, $DUR - $FADE))")
          echo "фильм $FILM, длительность $DUR с, темп $SP"
          if [ "$FILM" = "render_disc" ]; then
            # «ДИСЦИПЛИНА»: перелом ровно посередине, на 62-й секунде. До него —
            # печальная тема и тиканье часов, после — приподнятая. Щелчок на
            # кнопке будильника в момент решения, шорох на белой вспышке.
            read M1_END M1_FADE M2_S TICK_END TICK_FADE M2_MS TICK_MS CLK_MS RST_MS < <(python3 -c "sp=float('$SP'); v=[63,59,62,38,34]; ms=[62,5,62.2,126.2]; print(' '.join(str(round(x*sp,3)) for x in v), ' '.join(str(int(round(x*sp*1000))) for x in ms))")
          else
            read M1_END M1_FADE M2_S TICK_END TICK_FADE M2_MS TICK_MS CLK_MS RST_MS < <(python3 -c "sp=float('$SP'); v=[170,166,168,114,128]; ms=[168,18,133.6,148.9]; print(' '.join(str(round(x*sp,3)) for x in v), ' '.join(str(int(round(x*sp*1000))) for x in ms))")
          fi
          M2_LEN=$(python3 -c "print(round(max(8.0, $DUR - $M2_S + 2), 3))")
          echo "музыка до $M1_END с, подъём со $M2_S с ($M2_LEN с), щелчок $CLK_MS мс, шорох $RST_MS мс"
          # ГОЧА: Golden Cage 110,8 с — короче тёмной части, поэтому зациклен
          # входом (-stream_loop 3). Без этого amix обрезал ролик до 110,8 с.
          "$FF" -nostdin -hide_banner -loglevel error -y \
            -i "$IN" -stream_loop 3 -i "$A/golden_cage.mp3" -stream_loop 3 -i "$A/borderless.mp3" \
            -stream_loop 20 -i "$A/clock_tick.mp3" -i "$A/mouse_click.mp3" -i "$A/whoosh.mp3" \
            -filter_complex "
              [1:a]atrim=0:$M1_END,asetpts=N/SR/TB,afade=t=in:st=0:d=2,
                   afade=t=out:st=$M1_FADE:d=4,volume=0.42[m1];
              [2:a]atrim=0:$M2_LEN,asetpts=N/SR/TB,adelay=$M2_MS|$M2_MS,
                   afade=t=in:st=$M2_S:d=2.5,volume=0.50[m2];
              [3:a]atrim=0:$TICK_END,asetpts=N/SR/TB,adelay=$TICK_MS|$TICK_MS,volume=0.30,
                   afade=t=out:st=$TICK_FADE:d=4[tick];
              [4:a]adelay=$CLK_MS|$CLK_MS,volume=0.85[clk];
              [5:a]adelay=$RST_MS|$RST_MS,volume=0.55[rst];
              [m1][m2][tick][clk][rst]amix=inputs=5:duration=longest:normalize=0,
                apad,atrim=0:$DUR,loudnorm=I=-14:TP=-1.5:LRA=11,
                afade=t=out:st=$FST:d=$FADE[a]" \
            -map 0:v -map "[a]" -c:v copy -c:a aac -b:a 192k "$OUT"
          ls -la "$OUT"

      - name: Выложить релизом
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="film-${{ needs.setup.outputs.name }}-${{ github.run_id }}"
          gh release create "$tag" "${{ needs.setup.outputs.name }}.mp4" \
             -R "${{ github.repository }}" -t "$tag" \
             -n "Готовый мастер со звуком: музыка, тиканье, щелчок, шорох, затухание 4,5 с."
          echo "релиз: $tag"

  # -------------------------------------------------------------- предпросмотр
  # Смотреть правки глазами, НЕ трогая машину автора: одна машина рисует
  # названные кадры и кладёт контактный лист релизом.
  preview:
    needs: setup
    if: needs.setup.outputs.mode == 'preview'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ASSETS_KEY }}
      - run: git clone --depth 1 git@github.com:${{ github.repository_owner }}/shortfilm-assets.git /tmp/assets
      - run: pip install --quiet --upgrade numpy pillow arabic-reshaper python-bidi

      - name: Нарисовать названные кадры
        env:
          SHORTFILM_FONTS: /tmp/assets/fonts
          SHORTFILM_LANG: ${{ needs.setup.outputs.lang }}
          SHORTFILM_TONE: ${{ needs.setup.outputs.tone }}
          SHORTFILM_MIRROR: ${{ needs.setup.outputs.mirror }}
          SHORTFILM_SPEED: ${{ needs.setup.outputs.speed }}
          SHORTFILM_CAM: ${{ needs.setup.outputs.cam }}
          SHORTFILM_FILM: ${{ needs.setup.outputs.film }}
        run: |
          cd engine
          python3 preview.py "${{ needs.setup.outputs.frames_list }}" "$PWD/preview"
          ls -la preview

      - name: Выложить лист релизом
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="preview-${{ needs.setup.outputs.name }}-${{ github.run_id }}"
          gh release create "$tag" engine/preview/sheet.jpg engine/preview/f*.jpg \
             -R "${{ github.repository }}" -t "$tag" -n "Контактный лист предпросмотра."
          echo "релиз: $tag"

  # -------------------------------------------------------------------- обложка
  # Превью для YouTube: одна машина рисует thumb.py и кладёт картинку релизом.
  thumb:
    needs: setup
    if: needs.setup.outputs.mode == 'thumb'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ASSETS_KEY }}
      - run: git clone --depth 1 git@github.com:${{ github.repository_owner }}/shortfilm-assets.git /tmp/assets
      - run: pip install --quiet --upgrade numpy pillow arabic-reshaper python-bidi

      - name: Нарисовать обложку
        env:
          SHORTFILM_FONTS: /tmp/assets/fonts
          SHORTFILM_LANG: ${{ needs.setup.outputs.lang }}
          SHORTFILM_TONE: ${{ needs.setup.outputs.tone }}
          SHORTFILM_MIRROR: ${{ needs.setup.outputs.mirror }}
          SHORTFILM_SPEED: ${{ needs.setup.outputs.speed }}
          SHORTFILM_CAM: ${{ needs.setup.outputs.cam }}
          SHORTFILM_FILM: ${{ needs.setup.outputs.film }}
        run: |
          cd engine
          python3 thumb.py "$PWD/thumb"
          ls -la thumb

      - name: Выложить обложку релизом
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="thumb-${{ needs.setup.outputs.name }}-${{ github.run_id }}"
          gh release create "$tag" engine/thumb/thumb*.jpg \
             -R "${{ github.repository }}" -t "$tag" -n "Обложка для YouTube."
          echo "релиз: $tag"
